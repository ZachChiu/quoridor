name: 部署到 Amazon S3

on:
  push:
    branches: ["main", "beta"] # main → 正式站；beta → beta.quoridorgame.com（試做中的遊戲全部合在一起測）
  workflow_dispatch: # 允許手動觸發

# beta 站（2026-10-24 建）：bucket 與 distribution 都不是機密，直接寫在這裡，不用另外設 GitHub secret。
# distribution 是照正式站複製的，只差網域、來源 bucket、憑證，外加一個 X-Robots-Tag: noindex 的回應標頭
# （beta-noindex），搜尋引擎不會收錄。
env:
  BETA_S3_BUCKET: quoridorgame-beta
  BETA_CLOUDFRONT_DISTRIBUTION_ID: E3QE1R78LMII02

jobs:
  # 構建和部署工作
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          # Sentry 的 setCommits: auto 要從 git 歷史關聯 commit，
          # 預設的淺層 clone（depth 1）沒有歷史可關聯，suspect commits 就出不來
          fetch-depth: 0

      - name: 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      # 字型子集是照原始碼實際用字切的。文案改了卻忘記重建，
      # 新字會安靜地掉到系統備援字體（不會報錯，只是長得不一樣），
      # 所以在建置前先擋下來。
      - name: 檢查字型子集
        run: npm run font:check

      # 分享圖也是預先產生、產物進版控的。文案改了卻忘記重建，圖上就會是
      # 舊句子 —— 而那只有在別人把連結貼進聊天室時才看得到，站上永遠正常。
      - name: 檢查分享圖
        run: npm run og:check

      # 這三道原本只在本機跑 —— 也就是「忘了跑」跟「跑了沒過」對 CI 來說
      # 長得一模一樣，壞掉的規則邏輯照樣會被部署上去。放在 build 之前：
      # 型別或測試沒過就不該浪費時間建置，更不該上線。
      - name: 檢查型別
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 測試
        run: npm test

      - name: 構建專案
        run: npm run build
        env:
          # 根據分支設置不同的環境變數
          # 只有正式站載 GA（app/shell.tsx 看的是 production）—— beta 的瀏覽不能混進數據
          NEXT_PUBLIC_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'beta' }}
          NEXT_PUBLIC_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          SITE_URL: ${{ github.ref == 'refs/heads/main' && secrets.SITE_URL || 'https://beta.quoridorgame.com' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}

          # Sentry —— 執行時。DSN 已寫死在 instrumentation-client.ts。
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          # release 不在這裡設：next.config.ts 從 package.json 的 version 算出
          # （由 npm run release 維護），同時餵給建置期與 runtime。
          # 只有一個來源，就不會有「兩邊對不上」這種問題。

          # Sentry —— 建置時（source map 上傳，不進 client bundle）。
          # org 與 project 已寫死在 next.config.ts，這裡只剩 token。
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # 驗建置產物（out/）：路由、sitemap、hreflang、分享圖、source map 沒外洩。
      # 上面那道 npm test 跑在 build 之前，那時 out/ 還不存在，這個檔案整組
      # skipIf 掉了 —— 等於從來沒在 CI 跑過。必須在 build 之後、上傳之前再跑一次。
      #
      # 其中「沒有 .map 檔」這一條特別要緊：Sentry 上傳失敗不會讓 build 失敗
      # （next.config.ts 的 errorHandler），而沒上傳成功的 source map
      # 可能留在 out/ 裡，下一步 s3 sync 就把原始碼公開了。
      - name: 檢查建置產物
        run: npx vitest run tests/build

      - name: 配置 AWS 憑證
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 部署到 S3 - 正式環境
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 sync ./out s3://${{ secrets.PROD_S3_BUCKET_NAME }} --delete

      - name: 部署到 S3 - beta
        if: github.ref == 'refs/heads/beta'
        run: |
          aws s3 sync ./out s3://${{ env.BETA_S3_BUCKET }} --delete

      - name: 清除 CloudFront 快取 - 正式環境
        env:
          PROD_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
        if: github.ref == 'refs/heads/main' && env.PROD_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.PROD_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      # 301 轉址＋目錄網址補 index.html（infra/cloudfront-redirects.js）。
      # 只在 main 跑：function 是整個帳號共用的（beta 的 distribution 也掛同一支），beta 部署時更新會直接影響正式站。
      # continue-on-error：這一步出問題（還沒建立、缺權限、測試沒過）不該擋住網站部署；
      # 測試沒過時腳本不會發布，線上維持舊版，GitHub 上會出現黃色警告。
      - name: 更新 CloudFront Function（轉址）
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: bash scripts/deploy-cloudfront-function.sh

      - name: 清除 CloudFront 快取 - beta
        if: github.ref == 'refs/heads/beta'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.BETA_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
