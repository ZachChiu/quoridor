name: 部署到 Amazon S3

on:
  push:
    branches: ["main", "dev"] # 當推送到 main 或 dev 分支時觸發
  workflow_dispatch: # 允許手動觸發

jobs:
  # 構建和部署工作
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          # Sentry 的 setCommits: auto 要從 git 歷史關聯 commit，
          # 預設的淺層 clone（depth 1）沒有歷史可關聯，suspect commits 就出不來
          fetch-depth: 0

      - name: 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      # 字型子集是照原始碼實際用字切的。文案改了卻忘記重建，
      # 新字會安靜地掉到系統備援字體（不會報錯，只是長得不一樣），
      # 所以在建置前先擋下來。
      - name: 檢查字型子集
        run: npm run font:check

      # 分享圖也是預先產生、產物進版控的。文案改了卻忘記重建，圖上就會是
      # 舊句子 —— 而那只有在別人把連結貼進聊天室時才看得到，站上永遠正常。
      - name: 檢查分享圖
        run: npm run og:check

      # 這三道原本只在本機跑 —— 也就是「忘了跑」跟「跑了沒過」對 CI 來說
      # 長得一模一樣，壞掉的規則邏輯照樣會被部署上去。放在 build 之前：
      # 型別或測試沒過就不該浪費時間建置，更不該上線。
      - name: 檢查型別
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 測試
        run: npm test

      - name: 構建專案
        run: npm run build
        env:
          # 根據分支設置不同的環境變數
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}

          # Sentry —— 執行時。DSN 已寫死在 instrumentation-client.ts。
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          # release 不在這裡設：next.config.ts 從 package.json 的 version 算出
          # （由 npm run release 維護），同時餵給建置期與 runtime。
          # 只有一個來源，就不會有「兩邊對不上」這種問題。

          # Sentry —— 建置時（source map 上傳，不進 client bundle）。
          # org 與 project 已寫死在 next.config.ts，這裡只剩 token。
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: 配置 AWS 憑證
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 部署到 S3 - 正式環境
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 sync ./out s3://${{ secrets.PROD_S3_BUCKET_NAME }} --delete

      - name: 部署到 S3 - 開發環境
        if: github.ref == 'refs/heads/dev'
        run: |
          aws s3 sync ./out s3://${{ secrets.DEV_S3_BUCKET_NAME }} --delete

      - name: 清除 CloudFront 快取 - 正式環境
        env:
          PROD_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
        if: github.ref == 'refs/heads/main' && env.PROD_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.PROD_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: 清除 CloudFront 快取 - 開發環境
        env:
          DEV_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }}
        if: github.ref == 'refs/heads/dev' && env.DEV_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.DEV_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
