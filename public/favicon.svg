<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="牆壁圍棋 Wall Go">
  <!--
    畫的是這個遊戲的核心動作：一顆棋子被牆從兩側圍起來。
    刻意不畫完整棋盤 —— 7×7 的格線在 16px 會糊成一團，
    而「圓形＋轉角的牆」即使縮到分頁列大小也還讀得出形狀。
  -->
  <rect width="64" height="64" rx="14" fill="#141010"/>
  <circle cx="27" cy="37" r="14" fill="#faf7f0"/>
  <path d="M11 15.5h37M48.5 15v34" stroke="#e9af4c" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
